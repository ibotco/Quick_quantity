<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Quantity — Offline Bill of Quantities</title>
<meta name="theme-color" content="#1f4e3d">
<meta name="description" content="Offline Bill of Quantities generator for Ghanaian building projects. Upload a plan picture, set the scale, and produce a fully priced BoQ.">
<link rel="manifest" href="manifest.json">
<script>
/* the theme is chosen before anything is painted, so a dark screen never
   flashes white on the way in */
(function () {
  try {
    var t = localStorage.getItem('plan2boq.theme');
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="3.5" y="3.5" width="25" height="25" rx="3.5" stroke="currentColor" stroke-width="2"/>
        <path d="M3.5 13.5h25M13.5 13.5V28.5" stroke="currentColor" stroke-width="2"/>
        <path d="M8 8h3M21 8h3M8 18h3M17 18h3M17 23h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Quick Quantity</h1>
        <small>Offline Bill of Quantities</small>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill" title="Everything runs on this device. The online price check is optional and sends nothing about the project."><span class="dot"></span> Works offline</span>
    <button class="btn ghost sm" id="btn-prices-top" title="Fetch current rates when connected — price feed, AI check or cedi index">Update prices</button>
    <button class="btn ghost sm" id="btn-projects" title="Bills you generate are kept on this device">Saved bills<span class="count" hidden>0</span></button>
    <button class="btn ghost sm" id="btn-summary" title="The building summary — areas, materials, cost" aria-pressed="false" aria-controls="side" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V6l8-3 8 3v14H4Z"/><path d="M9 20v-6h6v6"/></svg>Summary</button>
    <span class="user-slot" id="user-slot"></span>
    <button class="btn ghost sm" id="btn-theme" title="Light or dark — this device remembers" aria-pressed="false">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7Z"/></svg>
      <span id="theme-label">Dark</span></button>
    <button class="btn ghost sm" id="btn-settings" title="Building type, structure, services and pricing">Settings</button>
    <button class="btn ghost sm" id="btn-sample" title="Load the PS 1 school block model">PS 1 sample</button>
    <button class="btn ghost sm" id="btn-new" title="Start a new bill">New</button>
  </header>

  <div class="layout">
    <nav class="steps" id="steps"></nav>
    <main id="main"></main>
  </div>

  <div class="footer-note">Quick Quantity · Ghana Standard Method of Measurement · rates in Ghana Cedis (GH¢) · all calculations run on this device</div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*,application/pdf,.pdf" multiple hidden>
<input type="file" id="json-input" accept="application/json,.json" hidden>
<input type="file" id="lib-input" accept="application/json,.json" hidden>
<input type="file" id="vertical-input" accept="image/*,application/pdf,.pdf" hidden>
<input type="file" id="roof-input" accept="image/*,application/pdf,.pdf" hidden>
